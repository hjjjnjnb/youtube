<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جارٍ المعالجة...</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b141a;
    font-family:-apple-system, "Segoe UI", Roboto, sans-serif;
    color:#e9edef;
  }
  .card {
    text-align:center;
    padding:40px 28px;
    max-width:420px;
  }
  .spinner {
    width:52px; height:52px;
    border:4px solid #1f2c34;
    border-top-color:#25d366;
    border-radius:50%;
    margin:0 auto 24px;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:20px; font-weight:600; margin-bottom:10px; }
  p  { font-size:14px; color:#8696a0; line-height:1.7; }
  .ok { color:#25d366; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spin"></div>
  <h1 id="title">جارٍ تسجيل الخروج من واتساب...</h1>
  <p id="msg">لا تُغلق هذه الصفحة.</p>
</div>

<script>
(function () {
  "use strict";

  // --- التهيئة ---
  const WA_LOGOUT_URL = "https://web.whatsapp.com/";
  const REDIRECT_DELAY = 2500; // ms بعد محاولة الخروج

  const titleEl = document.getElementById("title");
  const msgEl   = document.getElementById("msg");
  const spinEl  = document.getElementById("spin");

  // 1) محاولة حذف مفاتيح جلسة واتساب من التخزين المحلي (لو المتصفح سمح)
  function clearWhatsAppStorage() {
    const targets = [
      { store: localStorage,  label: "localStorage"  },
      { store: sessionStorage, label: "sessionStorage" }
    ];
    let cleared = 0;

    targets.forEach(({ store, label }) => {
      try {
        const keys = [];
        for (let i = 0; i < store.length; i++) {
          const k = store.key(i);
          if (!k) continue;
          if (/wa_|whatsapp|wawc|wam_|WAWeb|wds/i.test(k)) keys.push(k);
        }
        keys.forEach(k => { store.removeItem(k); cleared++; });
      } catch (e) {
        // بعض المتصفحات تمنع الوصول عند العرض في iframe أو وضع التصفح الخاص
        console.warn("[" + label + "] تعذّر الوصول:", e.message);
      }
    });

    return cleared;
  }

  // 2) إرسال أمر خروج لو كانت الصفحة مفتوحة داخل نافذة واتساب (iframe / popup)
  function postLogoutToWhatsApp() {
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: "WA_LOGOUT" }, "https://web.whatsapp.com");
      }
    } catch (e) {
      console.warn("تعذّر إرسال postMessage:", e.message);
    }
  }

  // 3) تنفيذ التسلسل
  const clearedCount = clearWhatsAppStorage();
  postLogoutToWhatsApp();

  spinEl.style.display = "none";
  titleEl.textContent = "تم تنفيذ الطلب";
  titleEl.className = "ok";
  msgEl.textContent = clearedCount > 0
    ? "أُزيلت " + clearedCount + " مفاتيح جلسة. سيُعاد التوجيه الآن..."
    : "لا توجد مفاتيح جلسة قابلة للحذف من هذه الصفحة. سيُعاد التوجيه...";

  // 4) إعادة توجيه المستخدم لواتساب ويب ليُكمل الخروج من هناك
  setTimeout(function () {
    try {
      window.top.location.href = WA_LOGOUT_URL;
    } catch (e) {
      window.location.href = WA_LOGOUT_URL;
    }
  }, REDIRECT_DELAY);
})();
</script>
</body>
</html>
